name: CMake Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -S . -B build
      - name: Build
        run: |
          cmake --build build --config Release
      - name: Run
        run: |
          build\Release\design_patterns_examples.exe
